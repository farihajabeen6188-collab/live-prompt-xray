mcp:
    servers:
        # The demo MCP server: App\Mcp\DemoTools, served over Streamable HTTP (and STDIO).
        demo:
            registry: 'App\Mcp\'
            description: 'Live Prompt X-Ray demo tools (weather, notes, calculator, slow archive, flaky service)'
            http:
                path: /mcp
            transports:
                stdio: true

    # The demo agent reaches the server above as a real MCP client.
    clients:
        xray:
            client_info:
                name: 'x-ray-demo-agent'
            request_timeout: 30
            max_retries: 0
            servers:
                demo: '%xray_demo.mcp_server%'

parameters:
    # Over HTTP, inside the container (the same FrankenPHP serves /mcp).
    xray_demo.mcp_server:
        transport: http
        url: '%env(DEMO_MCP_URL)%'

when@test:
    parameters:
        # Hermetic tests: the agent starts the demo MCP server as a STDIO child process.
        xray_demo.mcp_server:
            transport: stdio
            command: ['php', '%kernel.project_dir%/bin/console', 'mcp:server', '--env=test']
