name: live-prompt-xray

services:
  app:
    build: .
    image: live-prompt-xray:dev
    ports:
      - "${XRAY_HTTP_PORT:-8090}:80"
    environment:
      SERVER_NAME: ":80"
      MERCURE_JWT_SECRET: "${MERCURE_JWT_SECRET:-xray-local-dev-only-mercure-secret-32b}"
      MERCURE_URL: "http://localhost/.well-known/mercure"
      MERCURE_PUBLIC_URL: "/.well-known/mercure"
    volumes:
      - ./:/srv
      # vendor/ and var/ stay inside Docker: bind-mounted vendor/ is very slow on Windows and macOS.
      - app_vendor:/srv/app/vendor
      - app_var:/srv/app/var
      - composer_cache:/root/.composer/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/_xray/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

volumes:
  app_vendor:
  app_var:
  composer_cache:
